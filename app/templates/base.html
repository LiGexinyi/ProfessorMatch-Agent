<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ProfessorMatch Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/client-side-templates.js"></script>
    <script src="https://unpkg.com/mustache@4.2.0/mustache.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <div class="brand-icon">PM</div>
                <span>ProfessorMatch</span>
            </a>
            <div class="nav-links">
                <a href="/profile" class="nav-link">个人背景</a>
                <a href="/professors" class="nav-link">浏览教授</a>
                <a href="/scraper" class="nav-link">AI 抓取</a>
                <a href="/url-extractor" class="nav-link">URL 提取</a>
                <a href="/favorites" class="nav-link">收藏夹</a>
                <a href="/tracker" class="nav-link">进度追踪</a>
                <a href="/assistant" class="nav-link">AI 助手</a>
            </div>
        </div>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>&copy; 2026 ProfessorMatch Agent v2.0 - Python Edition</p>
    </footer>
    <script src="/static/js/app.js"></script>
</body>
</html>
