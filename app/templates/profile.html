{% extends "base.html" %}
{% block title %}个人背景 - ProfessorMatch{% endblock %}
{% block content %}
<div class="page-container">
    <div class="card profile-card">
        <div class="card-header gradient-header">
            <h2>个人背景信息</h2>
            <p>请填写您的学术背景和申请目标，这将帮助我们为您推荐最匹配的导师</p>
        </div>
        <div class="card-body">
            <form id="profileForm" class="form-grid">
                <div class="form-group full-width">
                    <label for="researchDirection">研究方向</label>
                    <textarea id="researchDirection" name="research_direction" rows="4"
                        placeholder="请描述您的主要研究兴趣和方向，例如：机器学习、自然语言处理、计算机视觉等"></textarea>
                </div>
                <div class="form-group full-width">
                    <label for="targetSchools">目标学校</label>
                    <textarea id="targetSchools" name="target_schools" rows="3"
                        placeholder="请列出您感兴趣的学校，用逗号分隔，例如：MIT, Stanford, Berkeley"></textarea>
                </div>
                <div class="form-group">
                    <label for="degreeBackground">学位背景</label>
                    <input type="text" id="degreeBackground" name="degree_background"
                        placeholder="例如：Bachelor's in CS">
                </div>
                <div class="form-group">
                    <label for="gpa">GPA</label>
                    <input type="text" id="gpa" name="gpa" placeholder="例如：3.8/4.0">
                </div>
                <div class="form-group full-width">
                    <label for="languageScores">语言成绩</label>
                    <textarea id="languageScores" name="language_scores" rows="3"
                        placeholder="例如：TOEFL 110, GRE 330"></textarea>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn btn-primary btn-full" id="saveBtn">保存个人背景</button>
                    <div id="saveMsg" class="msg hidden"></div>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const resp = await fetch('/api/profile');
    const profile = await resp.json();
    if (profile) {
        document.getElementById('researchDirection').value = profile.research_direction || '';
        document.getElementById('targetSchools').value = profile.target_schools || '';
        document.getElementById('degreeBackground').value = profile.degree_background || '';
        document.getElementById('gpa').value = profile.gpa || '';
        document.getElementById('languageScores').value = profile.language_scores || '';
    }
});

document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {
        research_direction: form.research_direction.value,
        target_schools: form.target_schools.value,
        degree_background: form.degree_background.value,
        gpa: form.gpa.value,
        language_scores: form.language_scores.value,
    };
    const resp = await fetch('/api/profile', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    const msg = document.getElementById('saveMsg');
    if (resp.ok) {
        msg.textContent = '保存成功！';
        msg.className = 'msg msg-success';
    } else {
        msg.textContent = '保存失败，请重试';
        msg.className = 'msg msg-error';
    }
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 3000);
});
</script>
{% endblock %}
