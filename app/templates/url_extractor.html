{% extends "base.html" %}
{% block title %}URL 提取 - ProfessorMatch{% endblock %}
{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1>从 URL 提取教授信息</h1>
        <p>输入教授的主页链接，AI 将自动提取研究方向和论文信息</p>
    </div>
    <div class="card">
        <div class="card-header"><h3>输入教授主页 URL</h3></div>
        <div class="card-body">
            <div class="form-group">
                <label>教授主页 URL</label>
                <div class="input-group">
                    <input type="url" id="urlInput" class="input-full"
                        placeholder="例如：https://cs.stanford.edu/~karpathy/">
                    <button class="btn btn-primary" id="extractBtn" onclick="extractInfo()">提取信息</button>
                </div>
            </div>
            <div id="extractMsg" class="msg hidden"></div>
        </div>
    </div>

    <div id="preview" class="hidden" style="margin-top: 1.5rem;">
        <div class="card">
            <div class="card-header"><h3>提取的教授信息</h3></div>
            <div class="card-body">
                <div class="info-grid" id="infoGrid"></div>
                <div class="btn-group" style="margin-top: 1rem;">
                    <button class="btn btn-success" id="createBtn" onclick="createProfessor()">添加到数据库</button>
                    <button class="btn btn-outline" onclick="cancelExtract()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top: 1.5rem; background: #eff6ff; border-color: #bfdbfe;">
        <div class="card-header"><h3 style="color: #1e40af;">使用提示</h3></div>
        <div class="card-body" style="color: #1e3a8a;">
            <p>&bull; 输入教授的个人主页、Google Scholar 或实验室网站 URL</p>
            <p>&bull; 系统将自动提取教授的基本信息、研究方向和近期论文</p>
            <p>&bull; 检查提取的信息是否准确，然后添加到数据库</p>
        </div>
    </div>
</div>
<script>
let extractedData = null;

async function extractInfo() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) {
        showMsg('请输入 URL', 'error');
        return;
    }
    const btn = document.getElementById('extractBtn');
    btn.disabled = true;
    btn.textContent = '提取中...';

    const resp = await fetch('/api/url-extractor/extract', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url}),
    });

    btn.disabled = false;
    btn.textContent = '提取信息';

    if (resp.ok) {
        const data = await resp.json();
        extractedData = data.data;
        extractedData._url = url;
        showPreview(data.data);
        showMsg('成功提取教授信息', 'success');
    } else {
        showMsg('提取失败，请检查 URL 是否正确', 'error');
    }
}

function showPreview(d) {
    const grid = document.getElementById('infoGrid');
    grid.innerHTML = `
        <div class="info-item"><label>姓名</label><p>${d.name || 'N/A'}</p></div>
        <div class="info-item"><label>大学</label><p>${d.university || 'N/A'}</p></div>
        <div class="info-item"><label>部门</label><p>${d.department || 'N/A'}</p></div>
        <div class="info-item"><label>研究方向</label><p>${d.researchAreas || 'N/A'}</p></div>
        <div class="info-item full-width"><label>近期论文</label><p>${d.recentPublications || 'N/A'}</p></div>
    `;
    document.getElementById('preview').classList.remove('hidden');
}

async function createProfessor() {
    if (!extractedData) return;
    const btn = document.getElementById('createBtn');
    btn.disabled = true;
    const resp = await fetch('/api/url-extractor/extract-and-create', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: extractedData._url}),
    });
    btn.disabled = false;
    if (resp.ok) {
        showMsg('成功添加教授到数据库', 'success');
        cancelExtract();
    } else {
        showMsg('添加失败，请重试', 'error');
    }
}

function cancelExtract() {
    document.getElementById('preview').classList.add('hidden');
    extractedData = null;
}

function showMsg(text, type) {
    const msg = document.getElementById('extractMsg');
    msg.textContent = text;
    msg.className = 'msg msg-' + type;
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 3000);
}
</script>
{% endblock %}
